name: Build Dr. Jhatuke APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate Android project (unzip if needed)
        id: locate
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "No project at repo root - looking for a ZIP..."
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No settings.gradle(.kts) and no .zip found in the repo."
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p _unzipped
            unzip -q -o "$ZIP" -d _unzipped
          fi
          SETTINGS=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find settings.gradle(.kts) anywhere."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          APK=$(find "${{ steps.locate.outputs.dir }}" -path '*outputs/apk/debug/*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::APK not found"; exit 1; }
          cp "$APK" Dr-Jhatuke-debug.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Jhatuke-debug-apk
          path: Dr-Jhatuke-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Dr-Jhatuke-debug.apk
